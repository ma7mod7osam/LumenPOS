<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>LumenPOS</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232A7BFF'/%3E%3Cstop offset='1' stop-color='%230B43B8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cg transform='translate(30,30)%20scale(0.833)'%3E%3Crect x='6' y='6' width='7.5' height='38' rx='3.75' fill='%23fff'/%3E%3Crect x='18' y='25' width='4.5' height='19' rx='2.25' fill='rgba(255,255,255,.62)'/%3E%3Crect x='27' y='25' width='7.5' height='19' rx='3.75' fill='%23fff'/%3E%3Crect x='39' y='25' width='4.5' height='19' rx='2.25' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="manifest" href="/assets/lumenpos/pos/manifest.json">
  <meta name="theme-color" content="#1463FF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LumenPOS">
  <link rel="apple-touch-icon" href="/assets/lumenpos/pos/icon-192.png">
  <link rel="stylesheet" href="/assets/lumenpos/pos/pos.css?v={{ lumenpos_version }}">
</head>
<body>
  <div id="app"></div>
  <script>
    window.csrf_token = "{{ csrf_token }}";
    window.lumenpos_version = "{{ lumenpos_version }}";
    // Keep the shell on the device so the till opens with no connection at
    // all, and so a reload during an outage is not the end of the shift.
    // Registered with the version, a release is a new worker and a new cache.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("/sw.js?v={{ lumenpos_version }}", { scope: "/pos" })
          .catch(function () {
            /* no service worker (old browser, plain http): the till still works online */
          });
      });
    }
  </script>
  <script type="module" src="/assets/lumenpos/pos/pos.js?v={{ lumenpos_version }}"></script>
</body>
</html>
